[package]
name = "phimakor"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "A Phigros/Phira high performance chart editor/previewer that with any you need it. Including Python, Gui, FXs and More Fancy And Smoothly."

[features]
profiling = ["dhat", "tracy-client"]
python = ["dep:pyo3"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "*"
serde = { version = "*", features = ["derive"] }
serde_json = "*"
serde_yaml = "0.9"
winit = "*"
wgpu = { version = "30", features = ["glsl", "spirv"] }
wgpu-core = "30"
pollster = "*"
rodio = "*"
image = "*"
fastblur = "0.1"
mimalloc = "0.1"
bytemuck = { version = "*", features = ["derive"] }
fontdue = "*"
softbuffer = "*"
# 镜像服务 TLS(WebGPU 需要 secure context,局域网 IP 的 http 会被浏览器
# 禁用 navigator.gpu;自签证书让手机 https 访问)。
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
iced = { version = "*", features = ["tiny-skia", "advanced", "image"] }
iced_tiny_skia = "*"
tiny-skia = "*"
tracing = "*"
tracing-subscriber = { version = "*", features = ["env-filter", "time", "registry"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
dhat = { version = "*", optional = true }
tracy-client = { version = "*", optional = true }
pyo3 = { version = "0.22", optional = true, features = ["extension-module"] }
texpresso = "2.0.2"
glslang = "0.8.1"
regex = "1.13.1"
rayon = "1"
# PMCORE-7:菜单 Load/Export 的原生文件对话框。Windows 后端无条件启用,
# 无需 Linux 的 xdg-portal/gtk3 特性;raw-window-handle 0.6 与 winit 0.30 兼容。
rfd = { version = "0.15", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_System_Com", "Win32_UI_Shell"] }


[dev-dependencies]
criterion = "*"

[target.'cfg(loom)'.dependencies]
loom = "0.7"

[[bench]]
name = "extract"
harness = false

[profile.dev]
codegen-units = 256
incremental = true

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
opt-level = 3
